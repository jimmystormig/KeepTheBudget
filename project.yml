name: KeepTheBudget
options:
  bundleIdPrefix: com.keepthebudget
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
settings:
  SWIFT_VERSION: 6.0
  MACOSX_DEPLOYMENT_TARGET: 27.0
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 1
packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 2.14.1
targets:
  KeepTheBudget:
    type: application
    platform: macOS
    sources:
      - KeepTheBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keepthebudget.KeepTheBudget
        INFOPLIST_FILE: KeepTheBudget/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeepTheBudget/App/KeepTheBudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: 6.0
    dependencies:
      - package: MSAL
        product: MSAL
